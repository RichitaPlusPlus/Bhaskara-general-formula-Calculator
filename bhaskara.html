<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Richita</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        header {
            background-color: #ff6b6b;
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        
        .calculator-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 40px;
            width: 90%;
            max-width: 500px;
        }
        
        .formula-display {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.2rem;
            color: #333;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #ff6b6b;
            outline: none;
        }
        
        button {
            background-color: rgb(26, 194, 166);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 10px;
            font-weight: 600;
        }
        
        button:hover {
            background-color: #c23d3d;
        }
        
        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 8px;
            display: none;
        }
        
        .result h3 {
            margin-top: 0;
            color: #333;
        }
        
        .result p {
            margin: 10px 0;
            font-size: 1.1rem;
        }
        
        .error {
            color: #ff1900;
            font-weight: 600;
            display: none;
            margin-top: 15px;
        }
        
        .hot-dog-icon {
            font-size: 2rem;
            margin-right: 10px;
        }
        
        .header-content {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Calculadora de richita</h1>
        </div>
    </header>
    
    <div class="calculator-container">
        <div class="formula-display">
            <p>Fórmula de Bhaskara: x = (-b±√(b²-4ac))/2a</p>
        </div>
        
        <div class="input-group">
            <label for="coef-a">Coeficiente a:</label>
            <input type="number" id="coef-a" placeholder="Ingrese el valor de a">
        </div>
        
        <div class="input-group">
            <label for="coef-b">Coeficiente b:</label>
            <input type="number" id="coef-b" placeholder="Ingrese el valor de b">
        </div>
        
        <div class="input-group">
            <label for="coef-c">Coeficiente c:</label>
            <input type="number" id="coef-c" placeholder="Ingrese el valor de c">
        </div>
        
        <button id="calculate-btn">Calcular</button>
        
        <div id="error-message" class="error">
            Por favor,complete todos los campos
        </div>
        
        <div id="result" class="result">
            <h3>resultados:</h3>
            <p id="discriminant"></p>
            <p id="x1"></p>
            <p id="x2"></p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calculateBtn = document.getElementById('calculate-btn');
            const resultDiv = document.getElementById('result');
            const errorMessage = document.getElementById('error-message');
            
            calculateBtn.addEventListener('click', calculateRoots);
            
            function calculateRoots() {
                // Obtener valores de los inputs
                const a = parseFloat(document.getElementById('coef-a').value);
                const b = parseFloat(document.getElementById('coef-b').value);
                const c = parseFloat(document.getElementById('coef-c').value);
                
                // Validar inputs o validaciones
                if (isNaN(a) || isNaN(b) || isNaN(c)) {
                    errorMessage.style.display = 'block';
                    resultDiv.style.display = 'none';
                    return;
                }
                
                if (a === 0) {
                    errorMessage.textContent = "El coeficiente 'a' no puede ser cero para una ecuación cuadrática.";
                    errorMessage.style.display = 'block';
                    resultDiv.style.display = 'none';
                    return;
                }
                
                // Ocultar mensaje de error si todo está bien
                errorMessage.style.display = 'none';
                
                // Calcular el discriminante
                const discriminant = b * b - 4 * a * c;
                
                // Mostrar el discriminante
                document.getElementById('discriminant').textContent = `Discriminante (Δ): ${discriminant}`;
                
                // Calcular las raíces según el valor del discriminante
                if (discriminant > 0) {
                    // Dos raíces reales distintas
                    const x1 = (-b + Math.sqrt(discriminant)) / (2 * a);
                    const x2 = (-b - Math.sqrt(discriminant)) / (2 * a);
                    
                    document.getElementById('x1').textContent = `x₁: ${x1.toFixed(4)}`;
                    document.getElementById('x2').textContent = `x₂: ${x2.toFixed(4)}`;
                } else if (discriminant === 0) {
                    // Una raíz real (raíz doble que se calcula)
                    const x = -b / (2 * a);
                    
                    document.getElementById('x1').textContent = `x: ${x.toFixed(4)} (raíz doble)`;
                    document.getElementById('x2').textContent = '';
                } else {
                    // Raíces complejas que se calculan
                    const realPart = -b / (2 * a);
                    const imaginaryPart = Math.sqrt(Math.abs(discriminant)) / (2 * a);
                    
                    document.getElementById('x1').textContent = `x₁: ${realPart.toFixed(4)} + ${imaginaryPart.toFixed(4)}i`;
                    document.getElementById('x2').textContent = `x₂: ${realPart.toFixed(4)} - ${imaginaryPart.toFixed(4)}i`;
                }
                
                // Mostrar los resultados
                resultDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
